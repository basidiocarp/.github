# Ecosystem Dependency Versions
#
# Single source of truth for shared dependency versions across all Rust projects.
# This file is informational — not mechanically enforced — but agents and
# developers should check it before upgrading any shared dependency.
#
# To check for drift:
#   grep -r 'spore.*tag' */Cargo.toml
#   grep -r 'rusqlite' */Cargo.toml

[spore]
version = "0.6.3"
rev = "d97a226a9a4051e42fbe1831aae4c811e7c65ac6"
git = "https://github.com/basidiocarp/spore"
consumers = ["mycelium", "hyphae", "rhizome", "stipe", "cortina", "canopy", "volva", "annulus", "hymenium"]
pending = []
note = "All consumers must pin using rev= (immutable) not tag= (mutable)."

[datetime]
crate = "chrono"
version = "0.4"
rationale = "Canonical datetime crate for the ecosystem: already used by spore and hyphae, and lowest-risk to standardize across cross-project timestamps."

[shared-deps]
anyhow = "1"
clap = "4"
clap_complete = "4"      # aligned: mycelium on 4
chrono = "0.4"       # canonical datetime crate
regex = "1"
rusqlite = "0.39"       # aligned: all consumers (mycelium, hyphae, canopy, cortina, stipe, annulus, hymenium)
serde = "1"
serde_json = "1"
thiserror = "2"
toml = "1"              # aligned: all consumers on 1
tracing = "0.1"
ulid = "1"
which = "7"

[tools]
# Tool versions: ecosystem-versions.toml is the single authority.
# Stipe reads this file at build time to generate its doctor version pins.
# Update this file when a tool is released; stipe picks it up on next build.
mycelium = "0.12.0"
hyphae = "0.16.0"       # 5-crate workspace; cli tracks tag, core/store/mcp/ingest at 0.13.2
rhizome = "0.12.0"      # 5-crate workspace, version per crate
canopy = "0.12.0"
cortina = "0.8.0"
stipe = "0.9.0"
volva = "0.4.0"
hymenium = "0.10.0"
annulus = "0.8.0"
cap = "0.15.1"
lamella = "0.8.0"
spore = "0.6.3"

